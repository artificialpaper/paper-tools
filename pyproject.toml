[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-tools"
version = "0.1.0"
description = "Executable Tool Engine & Sandboxing Runner for Paper AI Ecosystem"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "paper-common",
    "paper-proto",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "grpcio>=1.63.0",
    "jsonschema>=4.20.0",
]

[tool.setuptools.package-dir]
"paper_tools" = "app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
